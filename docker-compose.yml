
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      SUPABASE_ENDPOINT: ${SUPABASE_ENDPOINT}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_ACCESS_KEY: ${SUPABASE_ACCESS_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq

  blog-service:
    build:
      context: ./services/blog-service
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      SUPABASE_ENDPOINT: ${SUPABASE_ENDPOINT}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_ACCESS_KEY: ${SUPABASE_ACCESS_KEY}
    ports:
      - "8081:8081"
    depends_on:
      - rabbitmq

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "8082:8082"
    depends_on:
      - rabbitmq

  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    environment:
      USER_SERVICE_URI: ${USER_SERVICE_URI}
      BLOG_SERVICE_URI: ${BLOG_SERVICE_URI}
    ports:
      - "8888:8888"
    depends_on:
      - user-service
      - blog-service
      - audit-service

  react-frontend:
    build:
      context: ./react/react-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - blog-service
      - user-service